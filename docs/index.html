<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout of the Day</title>
    <meta http-equiv="refresh" content="10"> <!-- Reload every 10 seconds -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Box Logo">
        <h1 id="box-name">CrossFit Box</h1>
    </div>
    <div class="container">
        <div class="box" id="warmup">Warm-Up: Loading...</div>
        <div class="box" id="strength">Strength: Loading...</div>
        <div class="box" id="wod">WOD: Loading...</div>
        <div class="box" id="accessory">Accessory: Loading...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
