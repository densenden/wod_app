<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout of the Day</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="header">
        <img src="assets/logo.png" alt="Box Logo" class="logo">
        <h1 id="box-name">CrossFit Alpha Box</h1>
        <span id="class-type">Workout of the Day</span>
        <span id="date"></span>
    </div>
    <div class="container" id="workout-container"></div>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            try {
                const [wodResponse, dictResponse] = await Promise.all([
                    fetch("./data/beta_wods.json"),
                    fetch("./data/crossfit_dict.json")
                ]);
                if (!wodResponse.ok || !dictResponse.ok) throw new Error("Failed to load data");
                const [data, crossfitDict] = await Promise.all([wodResponse.json(), dictResponse.json()]);
                document.getElementById("box-name").textContent = data.name || "CrossFit Box";
                document.getElementById("date").textContent = new Date().toLocaleDateString("en-US", {
                    weekday: "long", year: "numeric", month: "long", day: "numeric"
                });
                const workoutContainer = document.getElementById("workout-container");
                const layout = {
                    warmup: { columns: 8, rows: 2 },
                    strength: { columns: 8, rows: 2 },
                    wod: { columns: 12, rows: 2 },
                    qr: { columns: 4, rows: 2 },
                    accessory: { columns: 8, rows: 2 }
                };
                Object.entries(layout).forEach(([section, config]) => {
                    if (data.wods[0][section]) {
                        let div = document.createElement("div");
                        div.className = `box ${section}`;
                        div.style.gridColumn = `span ${config.columns}`;
                        div.style.gridRow = `span ${config.rows}`;
                        div.innerHTML = `<h2>${section.toUpperCase()}</h2><p>${formatText(data.wods[0][section], crossfitDict)}</p>`;
                        workoutContainer.appendChild(div);
                    }
                });
                let qrDiv = document.createElement("div");
                qrDiv.className = "box qr";
                qrDiv.style.gridColumn = "span 4";
                qrDiv.style.gridRow = "span 2";
                qrDiv.innerHTML = `<h2>QR</h2><div id="qrcode"></div>`;
                workoutContainer.appendChild(qrDiv);
                new QRCode(document.getElementById("qrcode"), window.location.href);
            } catch (error) {
                console.error("Error loading WOD:", error);
            }
        });
        function formatText(text, crossfitDict) {
            if (!text) return "No WOD available";
            text = text.replace(/:\s*(?![^()]*\))/g, ':<br>');
            crossfitDict.movements.forEach(movement => {
                let regex = new RegExp(`\b${movement}\b`, "g");
                text = text.replace(regex, `<p>${movement}</p>`);
            });
            return text;
        }
    </script>
</body>
</html>
